instances:
  J1:
    part: project:PowerHeader2
    value: 5V_POWER
  J2:
    part: project:PowerHeader2
    value: CTRL_INPUT
  J3:
    part: project:PowerHeader2
    value: SW_NODE_TEST
  Q1:
    part: project:NMOS2N7002
    value: 2N7002
  R1:
    part: project:R2K2
    value: 2.2k_LED
  R2:
    part: project:R2K2
    value: 2.2k_GATE
  R3:
    part: project:R100K
    value: 100k_PULLDOWN
  C1:
    part: project:C100N
    value: 100nF
  LED1:
    part: project:GreenLED
    value: GREEN
connections:
- net: 5V
  kind: power
  voltage: 5.0
  endpoints:
  - J1.#1
  - R1.#1
  - C1.#1
- net: GND
  kind: ground
  endpoints:
  - J1.#2
  - J2.#2
  - J3.#2
  - Q1.#2
  - R3.#2
  - C1.#2
- net: LED_A
  kind: signal
  endpoints:
  - R1.#2
  - LED1.#2
- net: LED_K_SW
  kind: signal
  endpoints:
  - LED1.#1
  - Q1.#3
  - J3.#1
- net: CTRL_IN
  kind: signal
  endpoints:
  - J2.#1
  - R2.#1
- net: GATE
  kind: signal
  endpoints:
  - R2.#2
  - Q1.#1
  - R3.#1
constraints:
- kind: layout
  target:
  - C1
  rule: place_near_power_input
  severity: warning
- kind: layout
  target:
  - R2
  - R3
  rule: place_near_mosfet_gate
  severity: warning
- kind: other
  rule: input_5V_logic_3V3_or_5V_max_load_onboard_led_only
  severity: info
outputs:
- type: protel2_netlist
  path: example/QuickPCB_5V_MOSFET_LED_Demo.net
- type: bom_csv
  path: example/QuickPCB_5V_MOSFET_LED_Demo-bom.csv
- type: mermaid
  path: example/QuickPCB_5V_MOSFET_LED_Demo.mmd
