connections:
  - net: VCC_9V
    kind: power
    voltage: 9
    endpoints: [J1.#1, Q2.#3, R5.#1, C4.#1, C5.#1]
  - net: GND
    kind: ground
    endpoints: [J1.#2, J2.#2, J3.#2, Q3.#3, R3.#2, R4.#2, C2.#2, C4.#2, C5.#2, C6.#2]

  - net: AUDIO_IN
    kind: signal
    endpoints: [J2.#1, C1.#2]
  - connect: [C1.#1, R1.#1]
  - connect: [R1.#2, R2.#2, R3.#1, Q1.#2]
  - connect: [Q1.#1, R4.#1, C2.#1]

  - connect: [R5.#2, D1.#1, Q2.#2]
  - connect: [D1.#2, D2.#1]
  - connect: [D2.#2, Q1.#3, Q3.#2]

  - connect: [Q2.#1, R6.#1]
  - connect: [Q3.#1, R7.#1]
  - net: OUT_INT
    kind: signal
    endpoints: [R6.#2, R7.#2, R2.#1, C3.#1]
  - net: SPEAKER_OUT
    kind: signal
    endpoints: [C3.#2, J3.#1, R8.#1]
  - connect: [R8.#2, C6.#1]

constraints:
  - kind: electrical
    target: VCC_9V
    rule: regulated_or_clean_single_supply
    value: 9V_nominal_7V_to_9V_allowed
    severity: error
  - kind: electrical
    target: J3
    rule: minimum_speaker_impedance
    value: 8ohm
    severity: error
  - kind: electrical
    target: [Q1, Q2, Q3]
    rule: preserve_selected_library_pinout
    value: selected_C50229519_and_C50229517_are_E_B_C_on_pins_1_2_3
    severity: error
  - kind: electrical
    target: [D1, D2]
    rule: preserve_selected_library_polarity
    value: selected_C7437620_is_A_on_pin_1_and_K_on_pin_2
    severity: error
  - kind: electrical
    target: [C1, C2, C3, C5]
    rule: observe_electrolytic_polarity
    value: pin_1_positive_pin_2_negative
    severity: error
  - kind: electrical
    target: [D1, D2, R6, R7]
    rule: class_AB_idle_current_must_be_measured_on_first_power_up
    value: current_limited_supply_required
    severity: error
  - kind: thermal
