spec: board-spec/v0.2
project:
  name: S8050_S8550_Audio_Amplifier
  version: "0.4"
  drawing:
    title: S8050 / S8550 Simple Audio Amplifier
    number: QPCB-AMP-001
    description: Single-page hybrid wire and NET engineering schematic
    date: "2026-09-30"
  description: >-
    Simple single-supply mono class-AB audio amplifier for a 9 V supply and
    an 8 ohm speaker. Every physical instance is locked to a verified
    EasyEDA Pro system-library device and LCSC part number.

